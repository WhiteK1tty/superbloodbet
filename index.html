<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodBet</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="header-title">BLOODBET</div>
    <div class="header-sub">ставки</div>
    <div style="flex:1"></div>
    <div class="balance-btn" onclick="requestDeposit()">
        <div class="balance-plus">+</div>
        <div class="balance-value" id="balance-value">0 ₽</div>
    </div>
</header>

<div class="tabs">
    <button class="tab active" onclick="switchTab('day', this)">ставки дня</button>
    <button class="tab" onclick="switchTab('events', this)">все ставки</button>
    <button class="tab" onclick="switchTab('mybets', this)">мои ставки</button>
</div>

<div class="content">
    <div id="page-day" class="page active"></div>
    <div id="page-events" class="page"></div>
    <div id="page-mybets" class="page"></div>
</div>

<nav class="bottom-nav">
    <button class="nav-btn" onclick="showProfile()">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        Профиль
    </button>
    <button class="nav-btn" onclick="showSettings()">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Настройки
    </button>
</nav>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
