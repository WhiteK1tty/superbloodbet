<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodBet Admin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        html, body { height: 100%; margin: 0; }

        body {
            background: #b03030;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Хедер */
        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .admin-header-title {
            font-family: 'Oswald', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
        }

        .admin-header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .admin-header-badge {
            font-family: 'Oswald', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: rgba(255,255,255,0.85);
            letter-spacing: 1px;
        }

        .header-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .header-icon-btn:hover { opacity: 1; }

        /* Меню */
        .admin-menu {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 24px 20px;
        }

        .admin-menu-btn {
            flex: 1;
            min-height: 64px;
            padding: 0 24px;
            border-radius: 18px;
            border: none;
            background: #7a1a1a;
            color: #fff;
            font-family: 'Oswald', sans-serif;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-menu-btn:active { transform: scale(0.97); }
        .admin-menu-btn:hover { background: #8a2020; }

        /* Панели */
        .admin-panel {
            display: none;
            flex: 1;
            padding: 14px;
            overflow-y: auto;
        }

        .admin-panel.active { display: block; }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.85);
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            padding: 0 0 16px 0;
            letter-spacing: 1px;
        }

        .ban-item {
            background: rgba(0,0,0,0.25);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ban-item-name {
            font-family: 'Oswald', sans-serif;
            font-size: 15px;
            color: #fff;
        }

        .unban-btn {
            padding: 5px 12px;
            border-radius: 7px;
            border: 1px solid rgba(255,255,255,0.3);
            background: transparent;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .unban-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
    </style>
</head>
<body>

<!-- Хедер -->
<div class="admin-header">
    <div class="admin-header-title">BloodBet</div>
    <div class="admin-header-right">
        <button class="header-icon-btn" onclick="showProfile()" title="Профиль">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
        </button>
        <div class="admin-header-badge">Админ</div>
        <button class="header-icon-btn" onclick="showSettings()" title="Настройки">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </button>
    </div>
</div>

<!-- Главное меню -->
<div id="menu" class="admin-menu">
    <button class="admin-menu-btn" onclick="showPanel('matches')">Создать матч</button>
    <button class="admin-menu-btn" onclick="showPanel('currency')">Выдать валюту</button>
    <button class="admin-menu-btn" onclick="showPanel('payout')">Выплата</button>
    <button class="admin-menu-btn" onclick="showPanel('ban')">Забанить юзера</button>
    <button class="admin-menu-btn" onclick="showPanel('events')">Все матчи</button>
</div>

<!-- Создать матч -->
<div id="panel-matches" class="admin-panel">
    <button class="back-btn" onclick="showMenu()">‹ Назад</button>
    <div class="section">
        <div class="section-title">Создать матч</div>
        <div class="field"><label>ID матча</label><input type="text" id="eventId" placeholder="match1"></div>
        <div class="field"><label>Название</label><input type="text" id="eventTitle" placeholder="Спартак vs ЦСКА"></div>
        <div class="field"><label>Варианты (каждый с новой строки)</label><textarea id="eventOptions" placeholder="Спартак&#10;ЦСКА&#10;Ничья"></textarea></div>
        <div class="field"><label>Коэффициент 1 варианта</label><input type="number" step="0.01" id="odd1" placeholder="1.85"></div>
        <div class="field"><label>Коэффициент 2 варианта</label><input type="number" step="0.01" id="odd2" placeholder="2.10"></div>
        <div class="field"><label>URL логотипа 1 команды</label><input type="text" id="logo1" placeholder="https://..."></div>
        <div class="field"><label>URL логотипа 2 команды</label><input type="text" id="logo2" placeholder="https://..."></div>
        <div class="field">
            <label>Ставка дня</label>
            <select id="featured" style="width:100%;padding:11px 14px;border-radius:9px;border:1px solid rgba(100,0,6,0.5);background:rgba(4,0,0,0.95);color:#ff8888;font-size:15px;font-family:'Rajdhani',sans-serif;">
                <option value="false">Нет</option>
                <option value="true">Да ⭐</option>
            </select>
        </div>
        <button class="btn" onclick="createEvent()">Создать матч</button>
    </div>
</div>

<!-- Выдать валюту -->
<div id="panel-currency" class="admin-panel">
    <button class="back-btn" onclick="showMenu()">‹ Назад</button>
    <div class="section">
        <div class="section-title">Выдать валюту</div>
        <div class="field"><label>Username игрока</label><input type="text" id="give-username" placeholder="@username"></div>
        <div class="field"><label>Сумма (₽)</label><input type="number" id="give-amount" placeholder="500"></div>
        <button class="btn" onclick="giveBalance()">Выдать</button>
    </div>
    <div class="section">
        <div class="section-title">Забрать валюту</div>
        <div class="field"><label>Username игрока</label><input type="text" id="take-username" placeholder="@username"></div>
        <div class="field"><label>Сумма (₽)</label><input type="number" id="take-amount" placeholder="500"></div>
        <button class="btn" onclick="takeBalance()" style="background:linear-gradient(270deg,#4a0000,#880000,#4a0000)">Забрать</button>
    </div>
</div>

<!-- Выплата -->
<div id="panel-payout" class="admin-panel">
    <button class="back-btn" onclick="showMenu()">‹ Назад</button>
    <div class="section">
        <div class="section-title">Выплата выигрыша</div>
        <div class="field"><label>Username игрока</label><input type="text" id="payout-username" placeholder="@username"></div>
        <div class="field"><label>Сумма выплаты (₽)</label><input type="number" id="payout-amount" placeholder="1000"></div>
        <div class="field"><label>Комментарий (необязательно)</label><input type="text" id="payout-comment" placeholder="Выигрыш за матч..."></div>
        <button class="btn" onclick="doPayout()">Выплатить</button>
    </div>
</div>

<!-- Забанить -->
<div id="panel-ban" class="admin-panel">
    <button class="back-btn" onclick="showMenu()">‹ Назад</button>
    <div class="section">
        <div class="section-title">Забанить юзера</div>
        <div class="field"><label>Username</label><input type="text" id="ban-username" placeholder="@username"></div>
        <button class="btn" onclick="banUser()" style="background:linear-gradient(270deg,#4a0000,#880000,#4a0000)">Забанить</button>
    </div>
    <div class="section">
        <div class="section-title">Забаненные</div>
        <div id="ban-list"><div class="empty"><span class="empty-text">Нет забаненных</span></div></div>
    </div>
</div>

<!-- Все матчи -->
<div id="panel-events" class="admin-panel">
    <button class="back-btn" onclick="showMenu()">‹ Назад</button>
    <div class="section">
        <div class="section-title">Все матчи</div>
        <div id="events-list"><div class="empty"><span class="empty-text">Загрузка...</span></div></div>
    </div>
</div>

<div class="toast" id="toast"></div>
<script src="admin.js"></script>
</body>
</html>
