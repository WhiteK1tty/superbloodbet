<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodBet Admin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="header-title">ADMIN</div>
    <div class="header-sub">управление</div>
    <div style="flex:1"></div>
    <div class="admin-badge">ADMIN</div>
</header>

<div style="padding: 14px; padding-bottom: 20px;">

    <!-- Создать событие -->
    <div class="section">
        <div class="section-title">Создать событие</div>
        <div class="field">
            <label>ID события</label>
            <input type="text" id="eventId" placeholder="match1">
        </div>
        <div class="field">
            <label>Название</label>
            <input type="text" id="eventTitle" placeholder="Спартак vs ЦСКА">
        </div>
        <div class="field">
            <label>Варианты (каждый с новой строки)</label>
            <textarea id="eventOptions" placeholder="Спартак&#10;ЦСКА&#10;Ничья"></textarea>
        </div>
        <button class="btn" onclick="createEvent()">Создать событие</button>
    </div>

    <!-- Все события -->
    <div class="section">
        <div class="section-title">Все события</div>
        <div id="events-list">
            <div class="empty"><span class="empty-text">Загрузка...</span></div>
        </div>
    </div>

</div>

<!-- Модалка редактирования -->
<div id="edit-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:200;overflow-y:auto;padding:16px;">
    <div style="background:#1a0a0a;border-radius:16px;padding:18px;border:1px solid rgba(180,0,0,0.4);">
        <div class="section-title" id="edit-title">Редактировать событие</div>

        <div id="edit-fields"></div>

        <div style="display:flex;gap:8px;margin-top:8px;">
            <button class="btn" onclick="saveEvent()" style="flex:1">Сохранить</button>
            <button class="btn" onclick="closeModal()" style="flex:1;background:rgba(60,60,60,0.8);animation:none;">Отмена</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>
<script src="admin.js"></script>
</body>
</html>
