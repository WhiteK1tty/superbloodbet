<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodBet Admin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">
        <img src="logo.png" alt="BloodBet" onerror="this.parentElement.innerHTML='<div class=logo-fallback><div class=logo-drop></div></div>'">
    </div>
    <div class="header-info">
        <div class="header-title">ADMIN</div>
        <div class="header-sub">BloodBet · Управление</div>
    </div>
    <div class="admin-badge">ADMIN</div>
</header>

<div style="padding: 14px;">

    <div class="section">
        <div class="section-title">Создать событие</div>
        <div class="field">
            <label>ID события</label>
            <input type="text" id="eventId" placeholder="match1">
        </div>
        <div class="field">
            <label>Название события</label>
            <input type="text" id="eventTitle" placeholder="Спартак vs ЦСКА">
        </div>
        <div class="field">
            <label>Варианты (каждый с новой строки)</label>
            <textarea id="eventOptions" placeholder="Спартак&#10;ЦСКА&#10;Ничья"></textarea>
        </div>
        <button class="btn" onclick="createEvent()">Создать событие</button>
    </div>

    <div class="section">
        <div class="section-title">Все события</div>
        <div id="events-list">
            <div class="empty">
                <span class="empty-text">Загрузка...</span>
            </div>
        </div>
    </div>

</div>

<div class="toast" id="toast"></div>
<script src="admin.js"></script>
</body>
</html>
